<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Post')}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container mt-4">
    <h3 th:text="${post.id_Post == 0} ? 'Nuevo post' : 'Editar post'">Nuevo/Editar</h3>
    <hr/>
    <form method="post" th:action="@{/post/save}" th:object="${post}">
        <input type="hidden" th:field="*{id_Post}"/>
        <div class="form-group">
            <label for="title">Título</label>
            <input type="text" class="form-control" id="title" th:field="*{title}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="form-group">
            <label for="summary">Resumen</label>
            <input type="text" class="form-control" id="summary" th:field="*{summary}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></div>
        </div>
        <div class="form-group">
            <label for="content">Contenido</label>
            <textarea class="form-control" rows="5" id="content" th:field="*{content}"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="published" th:field="*{published}"/>
            <label class="form-check-label" for="published">Publicar</label>
        </div>
        <a th:href="@{/post}" class="btn btn-danger">Cancelar</a>
        <button type="submit" class="btn btn-primary" th:text="${post.id_Post == 0} ? 'Registrar' : 'Actualizar'">Reg/act</button>
    </form>
</div>
</body>
</html>
