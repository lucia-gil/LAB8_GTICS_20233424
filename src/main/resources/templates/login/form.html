<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container mt-4" style="max-width: 420px">
    <h3 class="text-center">Ingrese sus datos</h3>
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos</div>
    <form th:action="@{/processLogin}" method="post">
        <div class="form-group">
            <label for="username">Correo</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="correo" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="contraseña" autocomplete="current-password">
        </div>
        <input type="submit" class="btn btn-info btn-block" value="Iniciar sesion">
    </form>
</div>
</body>
</html>
