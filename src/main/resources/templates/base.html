<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
    <script th:src="@{/js/jquery-3.4.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <title th:text="${titulo}">Blog Telecom</title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark navbar-expand-sm fixed-top justify-content-between" th:fragment="navbar">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="navbar-brand" th:href="@{/post}">Blog Telecom</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/post}">Listar posts</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyAuthority('admin','user')">
            <a class="nav-link" th:href="@{/post/mine}">Mis posts</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyAuthority('admin','user')">
            <a class="nav-link" th:href="@{/post/create}">Crear post</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyAuthority('admin','user')">
            <a class="nav-link" th:href="@{/friend}">Amigos</a>
        </li>
        <li class="nav-item" sec:authorize="hasAuthority('admin')">
            <a class="nav-link" th:href="@{/user/list}">Listar usuarios</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyAuthority('admin','user')">
            <a class="nav-link" th:href="@{/user}">Mi perfil</a>
        </li>
    </ul>

    <div class="d-inline-flex align-items-center">
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/loginForm}" class="btn btn-info">Iniciar sesión</a>
        </div>
        <div sec:authorize="isAuthenticated()" class="d-inline-flex align-items-center">
            <span class="navbar-text text-light mr-2" th:if="${session.usuario != null}"
                  th:text="|Bienvenido ${session.usuario.firstname} ${session.usuario.lastname} (${session.usuario.rol.role_name})|">Bienvenido</span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <input class="btn btn-info" type="submit" value="Cerrar sesión">
            </form>
        </div>
    </div>
</nav>
</body>
</html>
